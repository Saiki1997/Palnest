<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palnest</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c1110; color: #d7ece8; font: 500 14px/1.4 system-ui, "Segoe UI", sans-serif; }
      .wrap { min-height: 100%; display: grid; place-items: center; }
      .card { text-align: center; }
      .mark { width: 40px; height: 40px; margin: 0 auto 14px; border-radius: 10px; background: #1a3d38; box-shadow: inset 0 0 0 2px #4ec9c4; }
      h1 { margin: 0; font-size: 18px; letter-spacing: -0.03em; }
      p { margin: 8px 0 0; color: #8aa3ad; }
      .bar { width: 160px; height: 3px; margin: 18px auto 0; overflow: hidden; border-radius: 99px; background: #1a2a28; }
      .bar i { display: block; width: 40%; height: 100%; background: #4ec9c4; animation: slide 0.9s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-120%); } to { transform: translateX(280%); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="mark"></div>
        <h1>Palnest</h1>
        <p>Opening the manager…</p>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </body>
</html>
