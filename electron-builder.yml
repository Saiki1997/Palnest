appId: com.palnest.app
productName: Palnest
copyright: Palnest
asar: true
compression: maximum
electronLanguages:
  - en-US
directories:
  output: dist-desktop
  buildResources: electron/resources
files:
  - electron/**/*
  - package.json
  - "!electron/**/*.map"
  - "!**/*.md"
extraResources:
  - from: publish/win-x64
    to: host
    filter:
      - "**/*"
      - "!**/*.pdb"
      - "!**/*.xml"
win:
  icon: electron/resources/icon.png
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: Palnest-${version}-windows.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Palnest
  deleteAppDataOnUninstall: false
  installerHeaderIcon: electron/resources/icon.png
  artifactName: Palnest-Setup-${version}.${ext}
extraMetadata:
  main: electron/main.mjs
electronVersion: 35.5.1
