appId: com.palnest.app
productName: Palnest
copyright: Palnest
asar: true
compression: maximum
electronLanguages:
  - en-US
directories:
  output: dist-desktop
  buildResources: electron/resources
files:
  - electron/**/*
  - package.json
  - "!electron/**/*.map"
  - "!**/*.md"
extraResources:
  - from: .output-desktop
    to: nitro
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.md"
win:
  icon: electron/resources/icon.png
  signAndEditExecutable: false
  target:
    - target: zip
      arch:
        - x64
  artifactName: Palnest-${version}-windows.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Palnest
  deleteAppDataOnUninstall: false
  artifactName: Palnest-Setup-${version}.${ext}
extraMetadata:
  main: electron/main.mjs
electronVersion: 35.5.1
