appId: com.palnest.app
productName: Palnest
copyright: Palnest
asar: true
compression: maximum
electronLanguages:
  - en-US
directories:
  output: dist-desktop
  buildResources: electron/resources
files:
  - electron/**/*
  - package.json
  - "!electron/**/*.map"
  - "!**/*.md"
  - "!node_modules/**"
npmRebuild: false
nodeGypRebuild: false
extraResources:
  - from: desktop-host
    to: host
    filter:
      - "**/*"
extraFiles:
  - from: electron/resources/README.txt
    to: README.txt
  - from: electron/resources/LICENSE.txt
    to: LICENSE.txt
win:
  icon: electron/resources/icon.png
  signAndEditExecutable: false
  requestedExecutionLevel: asInvoker
  target:
    - target: dir
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: Palnest-${version}-windows.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Palnest
  deleteAppDataOnUninstall: false
  installerHeaderIcon: electron/resources/icon.ico
  installerIcon: electron/resources/icon.ico
  uninstallerIcon: electron/resources/icon.ico
  installerSidebar: electron/resources/wizard/sidebar.bmp
  license: electron/resources/LICENSE.txt
  include: electron/installer-extra.nsh
  artifactName: Palnest-Setup-${version}.${ext}
  runAfterFinish: true
  menuCategory: Palnest
extraMetadata:
  main: electron/main.mjs
electronVersion: 35.5.1
